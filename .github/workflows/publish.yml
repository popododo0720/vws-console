# Publishes the vws-console image (#102) on a push to main, so vws-test can serve the console.
# Docker builds the Next.js standalone server from ./Dockerfile, the same file docker compose
# uses. The build is the check: a Dockerfile or standalone-output break fails the publish run.
# Tag: sha-<7-char commit>, immutable by convention: no job writes the same tag twice for another commit.
# Labels: org.opencontainers.image.revision is the full commit SHA; org.opencontainers.image.source
# is this repository, so a new package is linked to it (and inherits its Actions access).
# workflow_dispatch publishes an older commit on main (e.g. the one vws-deploy pins) the same way.
# Package visibility is not set here. It is changed only by hand in the package settings.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit on main to publish (full or short SHA). Empty means the main head.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  # The vws-deploy chart pulls <global.registry>/<name>, and global.registry is .../vws, so the
  # package is vws/console. vws-console would publish an image no chart pulls.
  IMAGE: ghcr.io/${{ github.repository_owner }}/vws/console

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the commit
        id: rev
        env:
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify "${REF:-HEAD}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::${sha} is not on main"; exit 1; }
          git checkout --detach "$sha"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 "$sha")" >> "$GITHUB_OUTPUT"
      # The token reaches docker only on stdin, never in args or output.
      - name: Log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and push
        id: push
        env:
          SHA: ${{ steps.rev.outputs.sha }}
          SHORT: ${{ steps.rev.outputs.short }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:sha-${SHORT}"
          docker build \
            --platform linux/amd64 \
            --target runner \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$ref" \
            .
          docker push "$ref"
          echo "image=${ref}" >> "$GITHUB_OUTPUT"
          echo "console ${ref} (revision ${SHA})" | tee -a "$GITHUB_STEP_SUMMARY"
