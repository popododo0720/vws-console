name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types: [console-api-main]
  workflow_dispatch:
    inputs:
      console_api_ref:
        description: Console API ref to test
        default: main
        type: string

jobs:
  # This repo's own guards (vws-deploy#448, #91). They run here because repo-guard.yml is only the pinned
  # vws-deploy caller (vws-deploy docs/design/repo-guard-reusable.md), whose shared jobs do not run them.
  guard:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md has the /correct loop, incident form and label (vws-deploy#448)
        run: scripts/guard.sh correct
      - name: Tracked files are English (allowlist .github/english-allowlist)
        run: scripts/guard.sh english
      - name: No tracked reference images under docs/design-references (#91)
        run: scripts/guard.sh references
      - name: guard.sh fails on broken inputs (/correct loop, Hangul, tracked reference image)
        run: scripts/guard_test.sh

  quality:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Prettier on the files this change touches (vws-deploy#300). The whole tree is checked
      # once the follow-up reformats the files that predate the check.
      - name: Prettier (changed files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD)
          if [[ ${#files[@]} -eq 0 ]]; then echo "no changed files"; exit 0; fi
          npx prettier --check --ignore-unknown --no-error-on-unmatched-pattern "${files[@]}"

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # The sentinel endpoint is only seen at build time; the scan fails if it or any exporter code reaches .next/static.
      - name: Build
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otlp-endpoint-sentinel.invalid:4318
        run: npm run build

      - name: Client bundle scan
        run: |
          bash scripts/check-client-bundle_test.sh
          bash scripts/check-client-bundle.sh .next/static http://otlp-endpoint-sentinel.invalid:4318

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Standalone runner layout and websocket relay
        run: npm run test:e2e:standalone

      # The OTel e2e runs the pinned OpenTelemetry Collector that scripts/otelcol.sh downloads and checks by sha256.
      - name: Cache the OpenTelemetry Collector
        uses: actions/cache@v6
        with:
          path: .cache/otelcol
          key: otelcol-contrib-0.164.0-linux-amd64

      - name: E2E OpenTelemetry (real Collector)
        run: npm run test:e2e:otel

  e2e-stack:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
        with:
          path: console
      - uses: actions/checkout@v7
        with:
          repository: popododo0720/vws-console-api
          path: vws-console-api
          ref: ${{ inputs.console_api_ref || github.event.client_payload.sha || 'main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: vws-console-api/go.mod
          cache-dependency-path: vws-console-api/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:stack
        env:
          VWS_CONSOLE_API_DIR: ../vws-console-api
